<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>페이지를 찾을 수 없습니다 · 그랑블루파트너스</title>
  <style>
    :root { color-scheme: light dark; --bg: #f2f5f5; --fg: #15222b; --muted: #4e5f69; --link: #1f5a8c; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0d1417; --fg: #e4ebee; --muted: #95a6ae; --link: #78b6da; } }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    main { text-align: center; padding: 16px; }
    h1 { font-size: clamp(24px, 5vw, 36px); font-weight: 600; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 16px; }
    a { color: var(--link); }
  </style>
</head>
<body>
  <main>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>주소가 바뀌었거나 없는 페이지입니다.</p>
    <a href="/">처음으로</a>
  </main>
</body>
</html>
