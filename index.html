<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Grand Blue Partners</title>
  <style>
    :root { color-scheme: light dark; --bg: #f7f9fb; --fg: #0b2a45; --muted: #5b6b7a; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0a1824; --fg: #e6eef5; --muted: #8fa3b5; } }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { text-align: center; padding: 16px; }
    h1 { font-size: clamp(28px, 6vw, 48px); font-weight: 600; letter-spacing: -0.01em; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Grand Blue Partners</h1>
    <p>Website coming soon.</p>
  </main>
</body>
</html>
